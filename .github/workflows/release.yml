name: Release native desktop builds

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - run: python -m pip install uv==0.12.5
      - run: uv sync --locked --extra test --extra build
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync python scripts/check_native.py
      - run: uv run --no-sync python -m PyInstaller --noconfirm packaging/desktop.spec
      - name: Check packaged Linux and Windows app
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            uv run --no-sync python scripts/check_native.py "dist/Digital Audio Manager/Digital Audio Manager.exe"
          else
            uv run --no-sync python scripts/check_native.py "dist/Digital Audio Manager/Digital Audio Manager"
          fi
      - name: Check packaged macOS app
        if: runner.os == 'macOS'
        run: uv run --no-sync python scripts/check_native.py "dist/Digital Audio Manager.app/Contents/MacOS/Digital Audio Manager"
      - name: Archive platform build
        shell: bash
        run: |
          python -c "import shutil; shutil.make_archive('Digital-Audio-Manager-${{ runner.os }}-${{ runner.arch }}', 'zip', 'dist')"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: Digital-Audio-Manager-*.zip
  publish:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
