name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --target python/vendor -r python/requirements.txt
      - run: PYTHONPYCACHEPREFIX=/tmp/dam-pycache python -m unittest discover -s tests -v
      - run: pnpm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
