[package]
name = "digital-audio-manager"
version = "0.1.2"
description = "Local music library and device sync tool"
authors = ["Carter"]
edition = "2021"

[lib]
name = "digital_audio_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
